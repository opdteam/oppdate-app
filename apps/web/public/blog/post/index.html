<style>:root{--row-rest:#F7F3EF}body{margin:0;background:var(--surface-card)}.wrap{max-width:var(--container-max);margin:0 auto}
a{color:var(--action)}a:hover{color:var(--action-press)}
.om-btn-badge{position:absolute;top:50%;right:8px;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;border-radius:var(--radius-pill)}
html{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;scroll-behavior:smooth}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:999px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover,::-webkit-scrollbar-thumb:active{background:var(--action);background-clip:content-box}
.om-rev{transition:opacity .7s var(--ease-out-soft),translate .7s var(--ease-out-soft)}
.om-motion .om-rev{opacity:0;translate:var(--rx,24px) 28px;will-change:opacity,translate}
.om-motion .om-rev.om-in{opacity:1;translate:0 0}
@media print{.om-motion .om-rev,.om-motion .om-rev.om-in{opacity:1 !important;translate:none !important}}
@media (prefers-reduced-motion:reduce){.om-rev,.om-motion .om-rev,.om-motion .om-rev.om-in{opacity:1 !important;translate:none !important;transition:none !important}}
.om-tex{position:relative;isolation:isolate}
.om-tex::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(currentColor 1px,transparent 1px);background-size:22px 22px}
.om-tex-light::before{color:#1A0F06;opacity:.13}
.om-tex-ink::before{color:#FFF9F4;opacity:.18}
.om-tex>*{position:relative;z-index:1}
div:has(>.oppdate-nav-center){position:relative}
.oppdate-nav-center{order:1;margin-left:0 !important;margin-right:auto}
div:has(>.oppdate-nav-center)>div:not([class]){order:2;flex:0 1 auto !important;min-width:180px}
.oppdate-nav-actions{order:3}
div:has(>.oppdate-nav-center)>.om-nav-mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2}
@media (max-width:520px){.om-newsletter{min-width:0 !important;width:100% !important;flex-wrap:wrap !important;border-radius:var(--radius-lg) !important;padding:14px !important;gap:12px}.om-newsletter>input{flex:1 1 100% !important;padding:6px 4px}.om-newsletter>a,.om-newsletter>button{flex:1 1 100% !important;width:100% !important;justify-content:center}}
@media (max-width:960px){.oppdate-nav-center{display:none !important}.oppdate-nav-burger{display:flex !important;order:4;flex:0 0 44px !important;margin-left:0 !important;align-self:center !important}.oppdate-nav-actions{display:flex !important;order:3;gap:10px !important;flex:0 1 auto !important;min-width:0 !important}div:has(>.oppdate-nav-center){flex-wrap:nowrap !important;overflow:visible !important}.oppdate-nav-actions>a[href="/auth/login"]{display:none !important}div:has(>.oppdate-nav-center)>.om-nav-mark{position:static !important;transform:none !important;order:0}div:has(>.oppdate-nav-center)>div:not([class]){order:2;flex:1 1 auto !important;min-width:0 !important}.oppdate-footer-grid{grid-template-columns:1fr 1fr !important}}
.om-circle-btn:not(:disabled):hover,.om-circle-btn:not(:disabled):active{border-color:var(--action) !important;background:var(--action) !important;color:var(--color-text-inverse) !important}
.oppdate-footer-grid{grid-template-columns:repeat(4,1fr) !important;align-items:start}
.om-panel-cta{display:none !important}
.om-fade-in{animation:om-fade-in 400ms var(--ease-out-soft)}
@keyframes om-fade-in{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}
/* Reading progress bar */
.blog-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#7a2d05,#c4881c);z-index:100;transition:width 50ms linear}
/* Post header */
.blog-post-header{max-width:720px;margin:0 auto;padding:80px 24px 32px}
.blog-post-header.has-cover{padding-top:0}
.blog-post-cover{width:100%;max-height:480px;object-fit:cover;border-radius:0 0 var(--radius-lg) var(--radius-lg);display:block;margin-bottom:32px}
@media (max-width:580px){.blog-post-cover{border-radius:0;max-height:320px}}
.blog-post-back{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sans);font-size:13px;color:var(--text-muted);text-decoration:none;margin-bottom:24px;transition:color var(--duration-fast) ease}
.blog-post-back:hover{color:var(--action)}
.blog-post-cat{display:inline-block;padding:4px 12px;border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;background:rgba(122,45,5,0.08);color:#7a2d05;margin-bottom:16px}
.blog-post-title{font-family:var(--font-display);font-size:clamp(28px,5vw,42px);font-weight:700;line-height:1.2;color:var(--text-heading);margin:0 0 16px}
.blog-post-meta{display:flex;align-items:center;gap:12px;font-family:var(--font-sans);font-size:14px;color:var(--text-muted);flex-wrap:wrap}
.blog-post-meta-sep{width:4px;height:4px;border-radius:50%;background:var(--line-strong)}
.blog-post-author{display:flex;align-items:center;gap:8px}
.blog-post-author img{width:28px;height:28px;border-radius:50%;object-fit:cover}
/* Prose */
.blog-prose{max-width:720px;margin:0 auto;padding:0 24px 48px;font-family:var(--font-sans);font-size:17px;line-height:1.75;color:var(--text-body)}
@media (max-width:580px){.blog-prose{font-size:16px;line-height:1.8}}
.blog-prose h1,.blog-prose h2,.blog-prose h3,.blog-prose h4{font-family:var(--font-display);color:var(--text-heading);line-height:1.3;margin:2em 0 0.6em}
.blog-prose h2{font-size:1.5em}
.blog-prose h3{font-size:1.25em}
.blog-prose p{margin:0 0 1.2em}
.blog-prose a{color:var(--action);text-decoration:underline;text-underline-offset:3px}
.blog-prose a:hover{color:var(--action-press)}
.blog-prose img{max-width:100%;height:auto;border-radius:var(--radius-md);margin:1.5em 0}
.blog-prose blockquote{margin:1.5em 0;padding:16px 24px;border-left:3px solid var(--action);background:rgba(122,45,5,0.04);border-radius:0 var(--radius-md) var(--radius-md) 0;font-style:italic;color:var(--text-muted)}
.blog-prose blockquote p:last-child{margin-bottom:0}
.blog-prose code{font-family:'SF Mono',Menlo,monospace;font-size:0.9em;background:rgba(122,45,5,0.06);padding:2px 6px;border-radius:4px}
.blog-prose pre{background:#1a0a00;color:#fdf7f2;padding:20px 24px;border-radius:var(--radius-md);overflow-x:auto;margin:1.5em 0;font-size:14px;line-height:1.6}
.blog-prose pre code{background:none;padding:0;color:inherit}
.blog-prose ul,.blog-prose ol{padding-left:1.6em;margin:0 0 1.2em}
.blog-prose li{margin-bottom:0.4em}
.blog-prose hr{border:none;height:1px;background:linear-gradient(90deg,transparent,var(--line-strong),transparent);margin:2em 0}
/* Separator */
.blog-post-sep{max-width:720px;margin:0 auto;padding:0 24px}
.blog-post-sep div{height:1px;background:linear-gradient(90deg,transparent,var(--line-strong),transparent)}
/* Related posts */
.blog-related{max-width:1120px;margin:0 auto;padding:48px 24px 64px}
.blog-related h2{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--text-heading);margin:0 0 28px}
.blog-related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media (max-width:900px){.blog-related-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:580px){.blog-related-grid{grid-template-columns:1fr;max-width:480px}}
.blog-related-card{border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-card);border:1px solid var(--line-subtle);transition:translate var(--duration-base) var(--ease-out-soft),box-shadow var(--duration-base) var(--ease-out-soft);cursor:pointer;text-decoration:none;display:flex;flex-direction:column}
.blog-related-card:hover{translate:0 -2px;box-shadow:0 8px 24px rgba(26,10,0,0.06)}
.blog-related-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.blog-related-card-body{padding:16px}
.blog-related-card-title{font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.35;color:var(--text-heading);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blog-related-card-meta{font-family:var(--font-sans);font-size:12px;color:var(--text-muted)}
/* Newsletter CTA */
.blog-cta{background:var(--surface-dark);padding:80px 24px;text-align:center}
.blog-cta h2{font-family:var(--font-display);font-size:clamp(24px,3.5vw,36px);font-weight:700;color:var(--text-on-dark);margin:0 0 12px}
.blog-cta p{font-family:var(--font-sans);font-size:16px;color:rgba(255,249,244,0.6);margin:0 auto 32px;max-width:460px;line-height:1.6}
.blog-cta .om-newsletter{margin:0 auto}
/* Skeleton */
.blog-skeleton{background:linear-gradient(90deg,var(--line-subtle) 25%,var(--surface-card) 50%,var(--line-subtle) 75%);background-size:200% 100%;animation:blog-shimmer 1.5s ease infinite;border-radius:var(--radius-md)}
@keyframes blog-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* No-cover accent */
.blog-post-accent{height:3px;background:linear-gradient(90deg,#7a2d05,#c4881c,#e4b86a);border-radius:2px;margin-bottom:32px}
</style>

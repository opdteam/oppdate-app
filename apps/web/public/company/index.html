/* Icon micro-animations */
@keyframes co-bounce{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.co-icon-bounce{animation:co-bounce 350ms var(--ease-out-soft)}

.co-map-tooltip{padding:5px 10px;border-radius:6px;background:rgba(22,14,8,0.92);border:1px solid rgba(255,249,244,0.12);font-family:var(--font-sans);font-size:12px;font-weight:500;color:#FFF9F4;white-space:nowrap;backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(0,0,0,0.3)}

@media (max-width:600px){.co-map-stats{gap:20px !important}.co-map-pills{gap:4px !important}.co-map-pill{padding:5px 10px !important;font-size:11px !important}}

<style>:root{--row-rest:#F7F3EF}body{margin:0;background:var(--surface-card)}.wrap{max-width:var(--container-max);margin:0 auto}
a{color:var(--action)}a:hover{color:var(--action-press)}
.om-btn-badge{position:absolute;top:50%;right:8px;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;border-radius:var(--radius-pill)}
html{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;scroll-behavior:smooth}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:999px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover,::-webkit-scrollbar-thumb:active{background:var(--action);background-clip:content-box}
.om-rev{transition:opacity .7s var(--ease-out-soft),translate .7s var(--ease-out-soft)}
.om-motion .om-rev{opacity:0;translate:var(--rx,24px) 28px;will-change:opacity,translate}
.om-motion .om-rev.om-in{opacity:1;translate:0 0}
@media print{.om-motion .om-rev,.om-motion .om-rev.om-in{opacity:1 !important;translate:none !important}}
@media (prefers-reduced-motion:reduce){.om-rev,.om-motion .om-rev,.om-motion .om-rev.om-in{opacity:1 !important;translate:none !important;transition:none !important}}
.om-tex{position:relative;isolation:isolate}
.om-tex::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(currentColor 1px,transparent 1px);background-size:22px 22px}
.om-tex-light::before{color:#1A0F06;opacity:.13}
.om-tex-ink::before{color:#FFF9F4;opacity:.18}
.om-tex>*{position:relative;z-index:1}
.om-glow{overflow:hidden}
.om-glow::after{content:"";position:absolute;left:50%;top:34%;width:min(860px,84%);aspect-ratio:1.7;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(194,65,12,.38),rgba(194,65,12,0) 68%);pointer-events:none;z-index:0}
div:has(>.oppdate-nav-center){position:relative}
.oppdate-nav-center{order:1;margin-left:0 !important;margin-right:auto}
div:has(>.oppdate-nav-center)>div:not([class]){order:2;flex:0 1 auto !important;min-width:180px}
.oppdate-nav-actions{order:3}
div:has(>.oppdate-nav-center)>.om-nav-mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2}
@media (max-width:520px){.om-newsletter{min-width:0 !important;width:100% !important;flex-wrap:wrap !important;border-radius:var(--radius-lg) !important;padding:14px !important;gap:12px}.om-newsletter>input{flex:1 1 100% !important;padding:6px 4px}.om-newsletter>a,.om-newsletter>button{flex:1 1 100% !important;width:100% !important;justify-content:center}}
@media (max-width:600px){.acc-foot{flex-direction:column;align-items:flex-start !important;gap:16px !important}.acc-foot>a{align-self:flex-start;width:auto;max-width:100%}}
.om-mega{padding:18px 22px !important;gap:22px !important}
.om-mega>div:first-child>div:last-child a{padding-top:4px !important;padding-bottom:4px !important}
.om-mega>div:first-child>div:last-child a>span:first-child{width:26px !important;height:26px !important}
.om-mega>div:last-child{gap:14px !important}
.om-circle-btn:not(:disabled):hover,.om-circle-btn:not(:disabled):active{border-color:var(--action) !important;background:var(--action) !important;color:var(--color-text-inverse) !important}
.oppdate-footer-grid{grid-template-columns:repeat(4,1fr) !important;align-items:start}
.om-panel-cta{display:none !important}
.cta-short{display:none}
@media (max-width:600px){.cta-long{display:none}.cta-short{display:inline}}
@media (max-width:960px){.split{grid-template-columns:1fr !important}.oppdate-nav-center{display:none !important}.oppdate-nav-burger{display:flex !important;order:4;flex:0 0 44px !important;margin-left:0 !important;align-self:center !important}.oppdate-nav-actions{display:flex !important;order:3;gap:10px !important;flex:0 1 auto !important;min-width:0 !important}div:has(>.oppdate-nav-center){flex-wrap:nowrap !important;overflow:visible !important}.oppdate-nav-actions>a[href="/auth/login"]{display:none !important}div:has(>.oppdate-nav-center)>.om-nav-mark{position:static !important;transform:none !important;order:0}div:has(>.oppdate-nav-center)>div:not([class]){order:2;flex:1 1 auto !important;min-width:0 !important}.oppdate-footer-grid{grid-template-columns:1fr 1fr !important}
.co-inquiry-grid{grid-template-columns:1fr !important}.co-inquiry-sticky{position:static !important}
.co-name-email{grid-template-columns:1fr !important}
.co-inquiry-card{padding:28px 24px !important}
.co-inquiry-left{padding-left:0 !important}.co-inquiry-accent{display:none !important}
}
@media (max-width:640px){.oppdate-nav-actions{gap:8px !important}.oppdate-nav-actions>a[href="/auth/register"]{padding-left:20px !important;padding-right:46px !important;font-size:14px !important}.oppdate-nav-burger{margin-left:0 !important}}@media (max-width:430px){.om-nav-mark{transform-origin:left center;scale:.82 !important}.oppdate-nav-actions>a[href="/auth/register"]{padding-left:12px !important;padding-right:34px !important;font-size:12px !important;height:34px !important}.oppdate-nav-burger{align-self:center !important}.oppdate-nav-actions{gap:6px !important}div:has(>.oppdate-nav-center){gap:8px !important;padding-left:16px !important;padding-right:16px !important}}

#inquiry .co-inquiry-left p{font-size:14px !important}
#inquiry .wrap{padding-top:48px !important;padding-bottom:48px !important}

/* Success check entrance */
@keyframes co-check-in{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.co-success-check{animation:co-check-in 500ms var(--ease-out-soft)}
@media (prefers-reduced-motion:reduce){.co-success-check{animation:none !important}}
/* Inquiry section */
.co-inquiry-sticky{position:sticky;top:100px;align-self:start}
.co-inquiry-section{background:linear-gradient(180deg,var(--row-rest) 0%,var(--surface-card) 50%,var(--row-rest) 100%)}
.co-inquiry-card{background:var(--surface-card);border:1px solid var(--line);border-radius:24px;padding:36px 32px;box-shadow:0 4px 24px rgba(44,26,14,0.07);transition:box-shadow 400ms var(--ease-out-soft)}
.co-inquiry-card:focus-within{box-shadow:0 10px 40px rgba(194,65,12,0.1),0 2px 8px rgba(44,26,14,0.06)}
/* Category pills */
.co-cat-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--radius-pill);border:1px solid var(--line);background:transparent;font-family:var(--font-sans);font-size:13px;font-weight:500;color:var(--text-body);cursor:pointer;transition:all 200ms var(--ease-out-soft);white-space:nowrap}
.co-cat-pill:hover{border-color:var(--action);color:var(--action);background:rgba(194,65,12,0.04)}
.co-cat-pill.active{border-color:var(--action);background:var(--action);color:var(--color-text-inverse);box-shadow:0 0 0 3px rgba(194,65,12,0.14),0 2px 8px rgba(194,65,12,0.18)}
.co-cat-pill.active:hover{background:var(--action-press)}
@keyframes co-pill-flash{0%{box-shadow:0 0 0 3px rgba(194,65,12,0.14),0 2px 8px rgba(194,65,12,0.18)}40%{box-shadow:0 0 0 8px rgba(194,65,12,0.25),0 2px 12px rgba(194,65,12,0.3)}100%{box-shadow:0 0 0 3px rgba(194,65,12,0.14),0 2px 8px rgba(194,65,12,0.18)}}
.co-cat-pill.flash{animation:co-pill-flash 800ms var(--ease-out-soft)}
@media (prefers-reduced-motion:reduce){.co-cat-pill.flash{animation:none !important}}
/* Form inputs */
.co-inquiry-input{width:100%;height:50px;background:rgba(255,255,255,0.85);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:14px;padding:14px 16px 14px 18px;font-family:var(--font-sans);font-size:15px;color:var(--color-text-ink);transition:border-color 200ms var(--ease-out-soft),box-shadow 200ms var(--ease-out-soft),background 200ms var(--ease-out-soft);outline:none}
.co-inquiry-input::placeholder{color:#B7A698}
.co-inquiry-input:focus{border-color:var(--line);border-left-color:var(--action);box-shadow:0 0 0 3px rgba(194,65,12,0.08);background:rgba(255,255,255,0.95)}
.co-inquiry-textarea{width:100%;min-height:140px;resize:vertical;background:rgba(255,255,255,0.85);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:14px;padding:14px 16px 14px 18px;font-family:var(--font-sans);font-size:15px;color:var(--color-text-ink);line-height:1.55;transition:border-color 200ms var(--ease-out-soft),box-shadow 200ms var(--ease-out-soft),background 200ms var(--ease-out-soft);outline:none}
.co-inquiry-textarea::placeholder{color:#B7A698}
.co-inquiry-textarea:focus{border-color:var(--line);border-left-color:var(--action);box-shadow:0 0 0 3px rgba(194,65,12,0.08);background:rgba(255,255,255,0.95)}
/* File upload with drag-and-drop state */
.co-file-label{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:12px;border:1.5px dashed var(--line-strong);cursor:pointer;transition:border-color var(--duration-base) ease,background var(--duration-base) ease,box-shadow var(--duration-base) ease}
.co-file-label:hover{border-color:var(--action);background:rgba(194,65,12,0.04)}
.co-file-label.has-file{border-style:solid;border-color:var(--action);background:rgba(194,65,12,0.06)}
.co-file-drag{border-color:var(--action) !important;background:rgba(194,65,12,0.08) !important;box-shadow:0 0 0 3px rgba(194,65,12,0.12) !important}
@keyframes co-dash-pulse{0%,100%{border-color:var(--action)}50%{border-color:rgba(194,65,12,0.4)}}
.co-file-drag{animation:co-dash-pulse 1s ease infinite}
@media (prefers-reduced-motion:reduce){.co-file-drag{animation:none !important}}
/* Submit button */
.co-submit-btn{width:100%;height:50px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:13px;border:none;background:linear-gradient(135deg,#D4843A 0%,#7A2D05 100%);color:#fff;font-family:var(--font-sans);font-size:15px;font-weight:600;cursor:pointer;transition:background 160ms ease,transform 160ms ease,box-shadow 160ms ease,opacity 160ms ease;box-shadow:0 4px 18px rgba(122,45,5,0.32)}
.co-submit-btn:hover{background:linear-gradient(135deg,#C07630 0%,#6A2504 100%);transform:translateY(-1px);box-shadow:0 7px 24px rgba(122,45,5,0.4)}
.co-submit-btn:active{background:linear-gradient(135deg,#A86328 0%,#5C2003 100%);transform:translateY(0);box-shadow:0 3px 10px rgba(122,45,5,0.28)}
.co-submit-btn.loading{opacity:0.78;cursor:default;pointer-events:none;transform:none}
.co-spinner{width:19px;height:19px;border-radius:50%;border:2.4px solid rgba(255,255,255,0.4);border-top-color:#fff;animation:co-spin 0.7s linear infinite}
@keyframes co-spin{to{transform:rotate(360deg)}}
</style>
